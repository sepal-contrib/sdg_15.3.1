name: Nightly

on:
  schedule:
    # 03:17 UTC; off the hour so it does not queue behind everything else
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  EARTHENGINE_TOKEN: ${{ secrets.EARTHENGINE_TOKEN }}

jobs:
  network:
    name: Network smoke (live Earth Engine)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: sepal_environment.yml
          cache-environment: true

      - name: Install the package and test extras
        shell: micromamba-shell {0}
        run: pip install -e ".[dev]"

      - name: Run the network-marked tests
        shell: micromamba-shell {0}
        # Tier 6: a 10 km2 AOI, two years, MODIS, end to end. It catches
        # server-side errors that graph-shape tests structurally cannot see -
        # bad remap arities, missing bands. It is NOT on the PR gate, which is a
        # known and accepted coverage hole.
        #
        # This is the only job that ever runs the test, so an empty selection here
        # would mean nobody ever learns it is broken. The count is asserted before
        # the run rather than left to pytest's exit code, and exit 5 -- which IS
        # the empty selection -- is reported as that rather than as a collection
        # failure.
        run: |
          set -euo pipefail
          status=0
          pytest -m "network" --collect-only -q > collected.txt || status=$?
          selected=$(awk '/::/ {n++} END {print n+0}' collected.txt)
          if [ "$status" -eq 5 ] || [ "$selected" -eq 0 ]; then
            echo "::error::the 'network' selection is empty; the nightly would run nothing"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            cat collected.txt
            echo "::error::collecting the 'network' selection failed; nothing ran"
            exit 1
          fi
          echo "selected ${selected} network tests"
          pytest -m "network" -q
