# The environment CI solves from, and it still serves the LIVE Voila entrypoint
# (`ui.ipynb`, the `ci` job's nbmake step) as well as the domain suite. So it
# deliberately carries pins `sdg1531` itself does not use: `matplotlib`, `natsort`,
# `rasterio` and `plotly` are all `component/`'s, and plotly is imported nowhere
# even there. Dropping them is the app-layer migration's call, together with adding
# `ipecharts` for the charts the app layer will render; doing it here would break
# the notebook this file also has to keep working.
name: sdg_15.3.1
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # sepal-ui was renamed to pysepal at 3.3.0; pysepal ships a sepal_ui shim that
  # redirects the old imports, so component/ is unchanged. Nothing else in the
  # solve moves: sepal-ui is simply replaced by pysepal and pysepal-api.
  - pysepal>=3.8.3,<4
  # pysepal declares this cap itself; kept explicit because ipyvuetify 3 drops
  # CalendarDaily, and below 1.8 there is no _version.semver
  - ipyvuetify>=1.8,<3
  # libarrow 15.0.2 links libgflags.so.2.2 but declares only glog, so gflags 2.3
  # drops that SONAME from the solve and pyarrow stops importing
  - gflags>=2.2,<2.3
  - pyproj  # Always include to avoid PROJ conflicts
  - setuptools<=80
  - wheel
  - pre-commit
  - gdal=3.8.3
  - pandas=2.2.3
  - matplotlib
  - numpy
  - geopandas=1.0.1
  - natsort
  - rasterio<=1.4.3
  - pip
  - pip:
    - git+https://github.com/openforis/earthengine-api.git@v1.6.14#egg=earthengine-api&subdirectory=python
    - plotly>=5.2.2,<6.0
    - ee-extra<2025.7.2
    # conda-forge tops out at 0.3.4, which predates the GAUL 2024 schema the
    # ADMIN aoi arm's codes assume -- pinned here, not in `dependencies:`, so
    # the solve cannot silently substitute the older schema.
    - pygaul>=0.4.2
