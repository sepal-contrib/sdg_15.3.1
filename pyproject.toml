[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdg_15.3.1"
version = "1.2.0"
description = "SDG indicator 15.3.1 (Land Degradation Neutrality) on Google Earth Engine"
requires-python = ">=3.12"
dependencies = [
    # the openforis fork is installed from git by sepal_environment.yml; the pin
    # here is the version the parity harness records and asserts (spec §12 Tier 4)
    "earthengine-api==1.6.14",
    "pandas>=2.2",
    "geopandas>=1.0",
    # pure-Python, zero dependencies; required so sdg1531.naming.normalize_str
    # transliterates non-Latin AOI names byte-identically to the legacy
    # pysepal scripts/utils.py:140, which is also anyascii-backed.
    "anyascii>=0.3.2",
]

[project.optional-dependencies]
app = [
    "pysepal>=3.8.3,<4",
    "solara",
    "ipecharts>=1.0.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sdg1531*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "strict"
markers = [
    "network: hits Google Earth Engine; excluded from the PR gate (pytest -m 'not network')",
    "parity: compares serialized ee graphs against tests/golden (Tier 4)",
    "slow: takes more than a second",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["component", "doc", "docs", "utils", "*.ipynb", "noxfile.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"sdg1531/palette.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sdg1531"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sdg1531"]

[[tool.mypy.overrides]]
module = ["ee.*", "geopandas.*", "shapely.*", "pyproj.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ee/__init__.py re-exports FeatureCollection, Image, Geometry etc. via plain
# `from .x import Y`, with no `__all__` — strict mode's implicit-reexport check
# otherwise treats every one of those as private to the submodule it came from.
module = ["ee"]
implicit_reexport = true

[tool.commitizen]
version = "1.2.0"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
version_files = [
    "pyproject.toml:version",
]
