name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  EARTHENGINE_TOKEN: ${{ secrets.EARTHENGINE_TOKEN }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: sepal_environment.yml
          cache-environment: true

      # This checks the VERSION, not the fork. The stock PyPI `earthengine-api`
      # reports 1.6.14 too, and the `domain` and `lint` jobs both `pip install -e
      # ".[dev]"` on top of this environment against a `earthengine-api==1.6.14`
      # pin (pyproject.toml:13) that PyPI can satisfy -- so a resolver decision to
      # take the wheel would swap the openforis fork out and leave this step, and
      # `test_the_recorded_ee_version_matches_this_environment`, both green. What
      # WOULD catch it is `test_scenario_graphs_match_the_goldens`: its 112
      # comparisons run through the INSTALLED `ee.serializer` against committed
      # goldens, so a build that serialized differently would redden them. (The
      # algorithm-table digest would not -- both its sides are committed files.)
      # Pinning the fork properly is the app-layer migration's to settle; until
      # then, read this step as a version check and not as a provenance guard.
      - name: Verify ee-api fork
        shell: micromamba-shell {0}
        run: |
          python -c "import ee; v=ee.__version__; print('ee-api:', v); assert v == '1.6.14', 'Expected fork 1.6.14, got ' + v"


      - name: Verify notebook kernelspec
        run: |
          kernel_name=$(python3 -c "import json; nb=json.load(open('ui.ipynb')); print(nb['metadata']['kernelspec']['name'])")
          expected="venv-sdg_15.3.1"
          if [ "$kernel_name" != "$expected" ]; then
            echo "ERROR: kernelspec name '$kernel_name' != expected '$expected'"
            echo "SEPAL's update-app.sh installs kernels as 'venv-<app_name>'. Update ui.ipynb metadata."
            exit 1
          fi
          echo "kernelspec name OK: $kernel_name"

      - name: Install test deps
        shell: micromamba-shell {0}
        run: pip install pytest nbmake ipykernel

      - name: Register kernel
        shell: micromamba-shell {0}
        run: python -m ipykernel install --user --name=test-kernel

      - name: Test UI notebook
        shell: micromamba-shell {0}
        run: pytest --nbmake ui.ipynb --nbmake-timeout=600 --nbmake-kernel=test-kernel

  # The `ci` job above still guards the Voila entrypoint (kernelspec + nbmake on
  # ui.ipynb). Its replacement is the app-layer migration's call, not this port's:
  # the domain jobs below are additive, and nothing above was touched.

  domain:
    name: Domain suite (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: sepal_environment.yml
          cache-environment: true

      - name: Install the package and test extras
        shell: micromamba-shell {0}
        run: pip install -e ".[dev]"

      - name: Run the offline suite
        shell: micromamba-shell {0}
        # The count is asserted, not inferred: "the command did not fail" is not
        # the same claim as "the tests ran", and a job that runs zero tests passes
        # every assertion it never made. Exit 5 IS the empty selection, so the
        # status is taken first and read as that. Piping into awk under pipefail
        # killed the step before any annotation printed; running the collection
        # under `if !` printed the generic "collecting failed" instead, which is
        # the less accurate of the two messages for the one case that matters.
        run: |
          set -euo pipefail
          status=0
          pytest -m "not network" --collect-only -q > collected.txt || status=$?
          selected=$(awk '/::/ {n++} END {print n+0}' collected.txt)
          if [ "$status" -eq 5 ] || [ "$selected" -eq 0 ]; then
            echo "::error::the 'not network' selection is empty; this job would pass vacuously"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            cat collected.txt
            echo "::error::collecting the 'not network' selection failed; nothing ran"
            exit 1
          fi
          echo "selected ${selected} offline tests"
          start=$SECONDS
          pytest -m "not network" -q --durations=10
          elapsed=$(( SECONDS - start ))
          echo "offline suite took ${elapsed}s"
          if [ "$elapsed" -gt 60 ]; then
            echo "::warning::offline suite took ${elapsed}s; the target is 60s"
            echo "It includes the parity harness and gates every PR - keep it fast."
          fi

  lint:
    name: ruff + mypy --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: sepal_environment.yml
          cache-environment: true

      - name: Install the package and test extras
        shell: micromamba-shell {0}
        run: pip install -e ".[dev]"

      # No path arguments in this job, deliberately. Naming paths is how a lint job
      # silently narrows: `mypy sdg1531` reads 28 files where `[tool.mypy] files`
      # reads 42, and `ruff check sdg1531 tests tools` stops covering the app
      # package the day it lands. Bare invocations read the same configuration a
      # developer's local run reads, so the two cannot drift apart.
      - name: ruff check
        shell: micromamba-shell {0}
        run: ruff check

      - name: ruff format
        shell: micromamba-shell {0}
        run: ruff format --check

      - name: mypy
        shell: micromamba-shell {0}
        run: mypy
