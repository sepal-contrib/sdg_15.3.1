name: sdg_15.3.1
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # sepal-ui was renamed to pysepal at 3.3.0; pysepal ships a sepal_ui shim that
  # redirects the old imports, so component/ is unchanged. Nothing else in the
  # solve moves: sepal-ui is simply replaced by pysepal and pysepal-api.
  - pysepal>=3.8.3,<4
  # pysepal declares this cap itself; kept explicit because ipyvuetify 3 drops
  # CalendarDaily, and below 1.8 there is no _version.semver
  - ipyvuetify>=1.8,<3
  # libarrow 15.0.2 links libgflags.so.2.2 but declares only glog, so gflags 2.3
  # drops that SONAME from the solve and pyarrow stops importing
  - gflags>=2.2,<2.3
  - pyproj  # Always include to avoid PROJ conflicts
  - setuptools<=80
  - wheel
  - pre-commit
  - gdal=3.8.3
  - pandas=2.2.3
  - matplotlib
  - numpy
  - geopandas=1.0.1
  - natsort
  - rasterio<=1.4.3
  - pip
  - pip:
    - git+https://github.com/openforis/earthengine-api.git@v1.6.14#egg=earthengine-api&subdirectory=python
    - plotly>=5.2.2,<6.0
    - ee-extra<2025.7.2
