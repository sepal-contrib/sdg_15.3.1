# The conda environment CI solves from, and the base SEPAL installs.
#
# It carries dependencies `sdg1531` and `app/` never import: matplotlib, natsort
# and rasterio are `component/`'s, and plotly is imported nowhere at all. They
# go when `component/` does (spec 2/3), not before -- the parity harness runs
# the legacy code to generate the graphs the port is compared against.
#
# The app layer is NOT installed from here. `pip install -e ".[app,dev]"` adds
# pysepal>=4 and ipecharts over the top, replacing the pysepal pinned below.
name: sdg_15.3.1
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # `<4` is the floor `component/` still runs on, through the sepal_ui shim that
  # redirects its old imports. The app extra installs pysepal>=4 over this; the
  # cap can be lifted once `component/` is gone.
  - pysepal>=3.8.3,<4
  # pysepal declares this cap itself; kept explicit because ipyvuetify 3 drops
  # CalendarDaily, and below 1.8 there is no _version.semver
  - ipyvuetify>=1.8,<3
  # libarrow 15.0.2 links libgflags.so.2.2 but declares only glog, so gflags 2.3
  # drops that SONAME from the solve and pyarrow stops importing
  - gflags>=2.2,<2.3
  - pyproj  # Always include to avoid PROJ conflicts
  - setuptools<=80
  - wheel
  - pre-commit
  - gdal=3.8.3
  - pandas=2.2.3
  - matplotlib
  - numpy
  - geopandas=1.0.1
  - natsort
  - rasterio<=1.4.3
  - pip
  - pip:
    - git+https://github.com/openforis/earthengine-api.git@v1.6.14#egg=earthengine-api&subdirectory=python
    - plotly>=5.2.2,<6.0
    - ee-extra<2025.7.2
    # Under `pip:`, not `dependencies:`: conda-forge tops out at 0.3.4, which
    # predates the GAUL 2024 schema the ADMIN aoi codes assume.
    - pygaul>=0.4.2
